<title>The Sheep Are Angry!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Single look: the game world is its own palette, so colors are set explicitly for both host themes. */
:root{--ink:#f4f2e6;--panel:rgba(22,28,18,.8);--tag:#e6b422;--rust:#e0835a;--moss:#9cbf6a;--bad:#e05a4a;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:#05070a;color:var(--ink);font:500 13px/1.3 var(--mono)}
#c{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));background:var(--panel);
  padding:10px 12px;border-radius:8px;display:grid;gap:6px;min-width:210px;pointer-events:none}
.row{display:grid;grid-template-columns:62px 1fr 64px;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.bar{height:7px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:4px}
#hud .top{display:flex;justify-content:space-between;gap:12px;font:800 15px/1.1 var(--display)}
#rank{color:var(--tag)}
#vFlock.pulse{animation:pulse 1.2s ease-out}
@keyframes pulse{0%{color:#e6b422;transform:scale(1.35)}100%{color:inherit;transform:scale(1)}}
#vFlock{display:inline-block;transform-origin:left center}
@media (prefers-reduced-motion:reduce){#vFlock.pulse{animation:none}}
.reg{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:-2px}
.stores{display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums;color:#d8d4c0}
.stores b{color:var(--ink)}
#btns{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,64px);gap:8px}
#btns button{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:var(--panel);color:var(--ink);
  font:800 11px/1 var(--display);touch-action:none;user-select:none;-webkit-user-select:none}
#btns button span{display:block;font:500 9px/1 var(--mono);opacity:.6;margin-top:3px}
#btns button:active,#btns button.on{background:rgba(230,180,34,.4)}
/* cooldown ring: --p runs from 0 to 1 as the action recharges, and the ring turns yellow when it's ready */
#btns button{position:relative;--p:1;border-color:transparent}
#btns button::before{content:"";position:absolute;inset:-3px;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--ring,rgba(255,255,255,.55)) calc(var(--p)*360deg),rgba(255,255,255,.12) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}
#btns button[hidden]{display:none}
#btns button.cooling{color:rgba(244,242,230,.55)}
#btns button.ready{--ring:var(--tag)}
#btns button:focus-visible{outline:2px solid var(--tag)}
#overlay{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;background:rgba(5,7,10,.78);overflow:auto;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{max-width:32rem;background:#232c1c;border:1px solid #3d4a31;border-radius:10px;padding:22px;margin:auto 0;margin-block:auto;padding-block:22px;font:400 14px/1.5 system-ui,sans-serif}
.card h1{font:800 2.2rem/1 var(--display);margin:0 0 .4rem;letter-spacing:-.02em}
.card h1 span{color:var(--rust)}
.card .eb{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--moss)}
.card ul{padding-left:1.1rem;margin:.6rem 0}
.card li{margin-bottom:.25rem}
.card kbd{font:500 12px var(--mono);background:#36422b;padding:1px 6px;border-radius:4px}
.card button{margin-top:10px;font:800 16px/1 var(--display);background:var(--tag);color:#2b2300;border:0;border-radius:6px;padding:12px 20px;cursor:pointer}
.recipes{display:grid;gap:8px;margin:0 0 .4rem}
.card.wide{max-width:50rem;width:100%}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card button.x{margin:0;padding:8px 12px;font-size:14px}
.resbar{display:flex;flex-wrap:wrap;gap:8px;margin:.7rem 0 .2rem;position:sticky;top:-22px;background:#232c1c;padding-block:8px;z-index:1}
.res{display:flex;align-items:center;gap:7px;background:#1a2114;border:1px solid #3d4a31;border-radius:6px;padding:6px 10px;font:500 12px var(--mono)}
.res i,.cost i{width:10px;height:10px;border-radius:2px;display:inline-block}
.res.load{margin-left:auto}
.res b{font:800 18px/1 var(--display);font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:#b9b4a0;margin:-.2rem 0 .5rem}
.recipes{grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.rec{display:flex;flex-direction:column;gap:6px;background:#2c3723;border:1px solid #3d4a31;border-radius:8px;padding:11px 12px}
.rec.can{border-color:var(--tag)}
.rec.cant{opacity:.5;filter:grayscale(.7)}
.rec.done{opacity:.7}
.rh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tier{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--moss);white-space:nowrap}
.costs{display:flex;flex-wrap:wrap;gap:5px}
.cost{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:4px;background:#1a2114;font:500 11px var(--mono)}
.cost.ok{color:#b6d68a}.cost.short{color:#ef9a74}
.lock{font:500 11px var(--mono);color:#d8d4c0}.lock.ok{color:#b6d68a}
.card .rec button{align-self:flex-start;margin-top:2px}
.rec>div{min-width:0}.rec p{margin:.15rem 0;font-size:13px;color:#d8d4c0}.rec b{font:800 15px/1.2 var(--display)}
.rk{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--moss);margin-bottom:3px}
.rc{font:500 11px var(--mono);color:var(--tag)}
.card h2.trk{font:800 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--rust);margin:1rem 0 .4rem}
.card .rec button{margin:0;padding:9px 14px;font-size:14px}
.card button:disabled{background:#4a5440;color:#8c947f;cursor:not-allowed}
.card button.ghost{background:none;color:var(--ink);border:1px solid #55634a}
.card button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:800 16px/1.2 var(--display);
  background:var(--panel);padding:8px 14px;border-radius:6px;pointer-events:none;text-align:center;max-width:min(34rem,calc(100% - 32px))}
@media (max-width:700px){#toast{top:auto;bottom:calc(160px + env(safe-area-inset-bottom,0px))}}
</style>

<canvas id="c"></canvas>
<div id="hud">
  <div class="top"><span id="day">Day 1</span><span id="rank">Stray</span></div>
  <div id="region" class="reg"></div>
  <div class="row"><span>Hunger</span><div class="bar"><i id="bHunger" style="background:#9cbf6a"></i></div><span id="vHunger">100</span></div>
  <div class="row"><span>Health</span><div class="bar"><i id="bHealth" style="background:#e05a4a"></i></div><span id="vHealth">100</span></div>
  <div class="row"><span>Fleece</span><div class="bar"><i id="bFleece" style="background:#f4f2e6"></i></div><span id="vFleece">2kg</span></div>
  <div class="row"><span>Flock</span><span id="vFlock">1 sheep</span><span id="vReady"></span></div>
  <div class="stores"><span>Wool <b id="vWool">0</b></span><span>Wood <b id="vWood">0</b></span><span>Stone <b id="vStone">0</b></span><span>Metal <b id="vMetal">0</b></span><span>Tech <b id="vTech">0</b></span></div>
  <div class="row"><span>Load</span><div class="bar"><i id="bLoad" style="background:#c89a5c"></i></div><span id="vLoad">0/15</span></div>
</div>
<div id="btns">
  <button id="bBleat" type="button">BLEAT<span>B</span></button><button id="bShear" type="button">SHEAR<span>F</span></button>
  <button id="bCraft" type="button">CRAFT<span>C</span></button>
  <button id="bGraze" type="button">GRAZE<span>SPACE</span></button><button id="bCharge" type="button">CHARGE<span>SHIFT</span></button>
</div>
<div id="toast" hidden></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const WORLD=9600,T=40,COLS=WORLD/T,DAY=140,NIGHT_START=0.62;
const VIS_DAY=290,VIS_NIGHT=80,EYES_RANGE=560,BLEAT_RANGE=700;
let vw,vh,dpr;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr}
addEventListener('resize',resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
let S; // game state
// explored-terrain picture for the minimap, one pixel per tile
const mmc=document.createElement('canvas');mmc.width=mmc.height=COLS;const mmx=mmc.getContext('2d');

// terrain: 0 meadow, 1 scree, 2 bog, 3 water, 4 old road. Only meadow can be grazed.
const MEADOW=0,SCREE=1,BOG=2,WATER=3,ROAD=4;
// regions: each has its own ground, resources and dangers. The richest are the hardest to stay in.
const REG=[
  {key:'meadows',name:'Home Meadows',blurb:'Sweet grass and few predators.',col:'#9cbf6a',grass:[0.5,0.95],trees:0.2,rocks:0.3,houses:0,wrecks:0,water:0.06,bog:0.05,scree:0,road:0,strays:1.3,
    wolf:0.6,fox:0.5,dog:0,dayWolf:0,dayFox:0},
  {key:'farm',name:'Old Farmland',blurb:'Barns and tractors to break up, but wild sheepdogs roam here.',col:'#d8b46a',grass:[0.4,0.8],trees:0.3,rocks:0.3,houses:1,wrecks:1,water:0.04,bog:0.03,scree:0,road:0.08,strays:1,
    wolf:1,fox:0.6,dog:1,dayWolf:0,dayFox:0},
  {key:'woods',name:'The Wildwood',blurb:'Endless timber and thin grass. Foxes hunt here even by day.',col:'#5f9a4a',grass:[0.15,0.45],trees:1.8,rocks:0.3,houses:0.1,wrecks:0,water:0.04,bog:0.08,scree:0,road:0,strays:0.7,
    wolf:1,fox:1.6,dog:0,dayWolf:0,dayFox:0.8},
  {key:'marsh',name:'The Marsh',blurb:'Bog and open water. Lost sheep, good grass, slow going.',col:'#6b8fa3',grass:[0.5,0.9],trees:0.2,rocks:0.1,houses:0,wrecks:0,water:0.3,bog:0.55,scree:0,road:0,strays:2.2,
    wolf:0.7,fox:1.1,dog:0,dayWolf:0,dayFox:0.2},
  {key:'fells',name:'The Fells',blurb:'Stone everywhere and barely any grass. Wolves prowl even by day.',col:'#b0ab9a',grass:[0.05,0.3],trees:0.1,rocks:2.6,houses:0,wrecks:0.1,water:0.05,bog:0,scree:0.62,road:0,strays:0.4,
    wolf:1.7,fox:0.3,dog:0,dayWolf:0.4,dayFox:0},
  {key:'town',name:'The Ruined Town',blurb:'Metal, stone and timber for the taking. No grass at all, and wolves and dogs day and night.',col:'#c06a4a',grass:[0,0.05],trees:0.15,rocks:0.6,houses:3.2,wrecks:3,water:0.02,bog:0,scree:0.05,road:0.85,strays:0.3,
    wolf:2.3,fox:0.4,dog:1.6,dayWolf:0.8,dayFox:0}];
function makeNoise(){const N=64,v=new Float32Array(N*N).map(()=>Math.random()),m=a=>((a%N)+N)%N;
  return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy),g=(a,b)=>v[m(b)*N+m(a)];
    return(g(xi,yi)*(1-sx)+g(xi+1,yi)*sx)*(1-sy)+(g(xi,yi+1)*(1-sx)+g(xi+1,yi+1)*sx)*sy}}
const regionAt=(x,y)=>S.reg[tileAt(x,y)];
function newGame(){
  const terr=new Uint8Array(COLS*COLS),grass=new Float32Array(COLS*COLS),reg=new Uint8Array(COLS*COLS),c=WORLD/2,ct=COLS/2;
  const nA=makeNoise(),nB=makeNoise(),nW=makeNoise(),nBg=makeNoise(),nS=makeNoise(),nR=makeNoise(),nG=makeNoise(),nT=makeNoise();
  // noise values bunch up around 0.5, so turn "fraction of tiles" into a threshold from samples
  const samp=[...Array(3000)].map(()=>nW(rnd(0,500),rnd(0,500))).sort((a,b)=>a-b),Q=p=>p<=0?-1:samp[Math.min(2999,~~(p*3000))];
  // one region per cell of a jittered 5x5 grid; home in the middle, the ruined towns in the far corners
  const seeds=[];for(let gy=0;gy<5;gy++)for(let gx=0;gx<5;gx++)seeds.push({x:(gx+rnd(.25,.75))*WORLD/5,y:(gy+rnd(.25,.75))*WORLD/5});
  seeds.forEach(sd=>sd.d=Math.hypot(sd.x-c,sd.y-c)/(WORLD*0.7));
  const byD=[...seeds].sort((a,b)=>a.d-b.d),pick=a=>a[~~rnd(0,a.length)];
  byD.forEach((sd,k)=>{const key=k===0?'meadows':k>=byD.length-2?'town':sd.d<0.3?pick(['meadows','farm','farm','woods'])
      :sd.d<0.55?pick(['farm','woods','marsh','meadows','fells']):pick(['fells','fells','marsh','woods','farm']);
    sd.t=REG.findIndex(r=>r.key===key)});
  for(let ty=0;ty<COLS;ty++)for(let tx=0;tx<COLS;tx++){const i=ty*COLS+tx;
    const wx=(tx+.5)*T+(nA(tx/10,ty/10)-.5)*900,wy=(ty+.5)*T+(nB(tx/10,ty/10)-.5)*900;
    let best=0,bd=1e12;seeds.forEach((sd,k)=>{const d=(sd.x-wx)**2+(sd.y-wy)**2;if(d<bd){bd=d;best=k}});
    const t=seeds[best].t,R=REG[t];reg[i]=t;
    let tr=MEADOW;
    if(nW(tx/7,ty/7)<Q(R.water))tr=WATER;else if(nBg(tx/6,ty/6)<Q(R.bog))tr=BOG;else if(nS(tx/9,ty/9)<Q(R.scree))tr=SCREE;else if(nR(tx/3,ty/3)<Q(R.road))tr=ROAD;
    if(Math.hypot(tx-ct,ty-ct)<7)tr=MEADOW;
    terr[i]=tr;
    grass[i]=tr===MEADOW?clamp(R.grass[0]+(R.grass[1]-R.grass[0])*nG(tx/5,ty/5)*1.2+rnd(-.05,.05),0,1):0;
  }
  // old roads wander across the whole map
  for(let k=0;k<10;k++){let x=k%2?0:rnd(10,COLS-10),y=k%2?rnd(10,COLS-10):0,a=k%2?0:Math.PI/2;
    for(let n=0;n<COLS*1.6;n++){a+=rnd(-.12,.12);x+=Math.cos(a);y+=Math.sin(a);if(x<0||y<0||x>=COLS||y>=COLS)break;
      for(const[ox,oy]of[[0,0],[1,0],[0,1]]){const tx=~~x+ox,ty=~~y+oy;if(tx<COLS&&ty<COLS&&terr[ty*COLS+tx]!==WATER){terr[ty*COLS+tx]=ROAD;grass[ty*COLS+tx]=0}}}}
  const far=(x,y,r)=>Math.hypot(x-c,y-c)>r,tt=(x,y)=>terr[tileAt(x,y)];
  const dry=(x,y)=>tt(x,y)!==WATER&&tt(x,y)!==ROAD;
  const rocks=[],posts=[],houses=[],trees=[],wrecks=[],strays=[];
  for(let ty=1;ty<COLS-1;ty++)for(let tx=1;tx<COLS-1;tx++){const i=ty*COLS+tx,tr=terr[i],R=REG[reg[i]],x=(tx+rnd(.2,.8))*T,y=(ty+rnd(.2,.8))*T;
    if(!far(x,y,170))continue;
    if((tr===MEADOW||tr===BOG)&&Math.random()<0.02*R.trees*(nT(tx/6,ty/6)>0.55?2.5:0.25))trees.push({x,y,r:rnd(15,24),res:5});
    else if(tr!==WATER&&tr!==ROAD&&Math.random()<(tr===SCREE?0.04:0.003)*R.rocks){const r={x,y,r:rnd(12,34)};r.big=r.r>=22;r.res=r.big?Math.round(r.r/4):0;rocks.push(r)}
    if(tr!==WATER&&Math.random()<(tr===ROAD?0.006:0.0008)*R.wrecks)wrecks.push({x,y,r:18,a:rnd(0,3.14),res:6,tractor:R.key==='farm'&&Math.random()<.6});
    if(tr!==WATER&&Math.random()<0.0012*R.houses){const h={x,y,w:rnd(90,150),h:rnd(70,110),res:16};
      if(tt(h.x+h.w,h.y+h.h)!==WATER&&tt(h.x+h.w,h.y)!==WATER&&tt(h.x,h.y+h.h)!==WATER&&!houses.some(o=>Math.abs(o.x-h.x)<170&&Math.abs(o.y-h.y)<140))houses.push(h)}
    if(Math.random()<0.0005*(R.key==='farm'?4:R.key==='meadows'?1:0.3)){const a=Math.random()<.5?0:Math.PI/2,n=8+~~rnd(0,10);
      for(let k=0;k<n;k++){const px=x+Math.cos(a)*k*34,py=y+Math.sin(a)*k*34;if(dry(px,py))posts.push({x:px,y:py,r:6})}}
    if((tr===MEADOW||tr===BOG)&&far(x,y,360)&&Math.random()<0.00022*R.strays){const n=Math.random()<.8?1:2;
      for(let k=0;k<n;k++){const sx=x+rnd(-40,40),sy=y+rnd(-40,40);if(tt(sx,sy)!==WATER)strays.push(mkSheep(sx,sy,Math.random()<.2))}}
  }
  for(const h of houses){const x=h.x+h.w+30,y=h.y+h.h/2;if(dry(x,y)&&Math.random()<.6)wrecks.push({x,y,r:20,a:rnd(0,3.14),res:8,tractor:true})}
  // abandoned pens with two or three sheep shut inside, mostly beside farm buildings
  const pens=[];
  const addPen=(x,y)=>{if(tt(x,y)===WATER||!far(x,y,500)||pens.some(o=>Math.hypot(o.x-x,o.y-y)<300))return;const pen={x,y,r:46};pens.push(pen);
    const n=2+(Math.random()<.5?1:0);for(let k=0;k<n;k++){const sh=mkSheep(x+rnd(-18,18),y+rnd(-18,18),Math.random()<.35);sh.pen=pen;strays.push(sh)}};
  for(const h of houses){const R=REG[reg[tileAt(h.x,h.y)]];if(Math.random()<(R.key==='farm'?0.7:0.15))addPen(h.x-70,h.y+h.h/2)}
  for(let i=0;i<4000&&pens.length<10;i++){const x=rnd(300,WORLD-300),y=rnd(300,WORLD-300);if(REG[reg[tileAt(x,y)]].key==='farm'&&tt(x,y)===MEADOW)addPen(x,y)}
  // one ewe and one ram within reach of home, so the first day has a chance
  for(const ram of[false,true]){for(let n=0;n<50;n++){const a=rnd(0,6.28),r=ram?rnd(520,700):rnd(320,460),x=c+Math.cos(a)*r,y=c+Math.sin(a)*r;if(tt(x,y)===MEADOW){strays.push(mkSheep(x,y,ram));break}}}
  S={t:DAY*0.12,terr,grass,reg,explored:new Uint8Array(COLS*COLS),rocks,posts,houses,trees,stumps:[],rubble:[],strays,flock:[],preds:[],texts:[],pings:[],
    folds:[],walls:[],decoys:[],traps:[],pens,confetti:[],penShown:false,alerts:[],barrenShown:false,wrecks,horns:0,shears:0,metal:0,stoneShown:false,metalShown:false,
    p:{x:c,y:c,vx:0,vy:0,face:0,hunger:100,health:100,fleece:2,dash:0,dashCd:0,cast:0,grazing:false,bob:0,still:0},
    wool:0,wood:0,stone:0,tech:0,beams:[],shocks:[],laserCd:0,ramLasers:false,techShown:false,bleatCd:0,orbit:0,circling:false,sp:{wolf:0,fox:8,dog:25},curReg:-1,seenKinds:{},driveShown:false,
    maxFlock:1,day:1,running:true,over:false,herdShown:false,flockShown:false,circleShown:false,grazeShown:false,lastDay:1,shake:0};
  mmx.fillStyle='#000';mmx.fillRect(0,0,COLS,COLS);grid=null;
}
// rams are tougher: two wolf bites or four fox bites, against one and two for a ewe
const EWE_NAMES=['Daisy','Clover','Mabel','Pearl','Bluebell','Hazel','Poppy','Rosie','Willow','Maud','Dot','Ivy','Nettle','Tansy','Fern','Heather','Primrose','Myrtle','Agnes','Sorrel','Bramble','Elsie','Winnie','Honey'];
const RAM_NAMES=['Bertram','Angus','Hector','Barnaby','Rufus','Monty','Ivor','Gideon','Hamish','Cedric','Basil','Ogden'];
let nameN=0;const pickName=ram=>{const l=ram?RAM_NAMES:EWE_NAMES;return l[(nameN++*7+~~rnd(0,l.length))%l.length]};
function mkSheep(x,y,ram){const hp=ram?4:2;return{name:pickName(ram),x,y,vx:0,vy:0,face:rnd(0,6.28),ram,fleece:rnd(2,5),wand:rnd(0,6.28),bob:rnd(0,9),seen:0,hp,maxhp:hp,rcd:0}}

// ---------- input ----------
const keys={};
let joy=null,grazeBtn=false,chargeReq=false,bleatReq=false,shearReq=false,craftReq=false;

function inputVec(){
  let x=0,y=0;
  if(keys['a']||keys['arrowleft'])x--; if(keys['d']||keys['arrowright'])x++;
  if(keys['w']||keys['arrowup'])y--; if(keys['s']||keys['arrowdown'])y++;
  if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,m=Math.hypot(dx,dy);if(m>8){x=dx/Math.max(m,50);y=dy/Math.max(m,50)}}
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return{x,y};
}

// ---------- helpers ----------
const tileAt=(x,y)=>{const tx=clamp(~~(x/T),0,COLS-1),ty=clamp(~~(y/T),0,COLS-1);return ty*COLS+tx};
function say(x,y,txt,col='#f4f2e6'){S.texts.push({x,y,txt,col,life:2.2})}
let toastT=0;function toast(m,sec=3.5){const el=$('toast');el.textContent=m;el.hidden=false;toastT=sec}
const circles=()=>S.rocks.concat(S.trees,S.walls,S.wrecks);
const CELL=200;let grid=null;
function solidsNear(x,y){
  if(!grid){grid=new Map();for(const o of circles()){const k=(~~(o.x/CELL))*4096+~~(o.y/CELL);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(o)}}
  const cx=~~(x/CELL),cy=~~(y/CELL),out=[];
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const c=grid.get((cx+dx)*4096+cy+dy);if(c)out.push(...c)}
  return out}
function inHouse(o,h,rad){return o.x>h.x-rad&&o.x<h.x+h.w+rad&&o.y>h.y-rad&&o.y<h.y+h.h+rad}
function collide(o,rad){
  for(const r of solidsNear(o.x,o.y)){const d=Math.hypot(o.x-r.x,o.y-r.y),m=r.r+rad;if(d<m&&d>0){o.x=r.x+(o.x-r.x)/d*m;o.y=r.y+(o.y-r.y)/d*m}}
  for(const h of S.houses){if(inHouse(o,h,rad)){
    const l=o.x-(h.x-rad),r=h.x+h.w+rad-o.x,t=o.y-(h.y-rad),b=h.y+h.h+rad-o.y,mn=Math.min(l,r,t,b);
    if(mn===l)o.x=h.x-rad;else if(mn===r)o.x=h.x+h.w+rad;else if(mn===t)o.y=h.y-rad;else o.y=h.y+h.h+rad}}
  o.x=clamp(o.x,rad,WORLD-rad);o.y=clamp(o.y,rad,WORLD-rad);
}
const phase=()=>(S.t%DAY)/DAY;
const isNight=()=>phase()>NIGHT_START;
// 0 = full day, 1 = full night
function nightness(){const ph=phase();
  if(ph<0.06)return 1-ph/0.06; if(ph<NIGHT_START-0.06)return 0;
  if(ph<NIGHT_START+0.02)return (ph-(NIGHT_START-0.06))/0.08; return 1}
// more eyes in the flock see further, up to a point
const vision=()=>{const n=S.flock.length,nt=nightness();
  return (VIS_DAY+Math.min(120,n*5)+(VIS_NIGHT+Math.min(50,n*2)-VIS_DAY-Math.min(120,n*5))*nt)*(S.p.grazing?0.7:1)};
function allSheep(){return [S.p,...S.flock]}
function neighbours(s,r){let n=0;for(const o of allSheep())if(o!==s&&Math.hypot(o.x-s.x,o.y-s.y)<r)n++;return n}
function rank(n){return n>=20?'Herd':n>=5?'Flock':'Stray'}
const CIRCLE_MIN=4; // flockmates needed to circle Flossy

function explore(){
  const p=S.p,r=vision(),tr=Math.ceil(r/T);
  const cx=~~(p.x/T),cy=~~(p.y/T);
  for(let y=cy-tr;y<=cy+tr;y++)for(let x=cx-tr;x<=cx+tr;x++){
    if(x<0||y<0||x>=COLS||y>=COLS)continue;const i=y*COLS+x;if(S.explored[i])continue;
    if(Math.hypot((x+.5)*T-p.x,(y+.5)*T-p.y)<r){S.explored[i]=1;const g=S.grass[i],tr=S.terr[i];
      mmx.fillStyle=tr===WATER?'#2c5470':tr===SCREE?'#7d7a6c':tr===BOG?'#3a422a':tr===ROAD?'#4a4a46':`rgb(${~~(90-g*45)},${~~(80+g*55)},${~~(50-g*15)})`;mmx.fillRect(x,y,1,1)}}
}

// how much the flock can carry: Flossy's own share, plus more for every ewe and more again for a ram
const carryCap=()=>15+S.flock.reduce((a,s)=>a+(s.ram?10:6),0);
const load=()=>S.wool+S.wood+S.stone+S.metal+S.tech;

function recruit(s,quiet){
  S.flock.push(s);s.seen=0;s.pen=null;const n=S.flock.length+1;
  say(s.x,s.y-30,s.ram?`${s.name} the ram joins!`:`${s.name} joins!`,s.ram?'#e6b422':'#f4f2e6');
  for(let k=0;k<26;k++){const a=rnd(0,6.28),v=rnd(60,200);S.confetti.push({x:s.x,y:s.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:rnd(.7,1.2),c:k%3?'#f4f2e6':s.ram?'#e6b422':'#9cbf6a'})}
  S.cheer=1;
  if(!quiet)toast(s.ram?`${s.name} the ram joins the flock! He will fight for you. (${n} sheep)`:`${s.name} joins the flock! (${n} sheep)`,3.5);

let actx=null;
function chime(low){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
  [low?392:523,low?523:659,low?659:784].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0,t+i*0.09);g.gain.linearRampToValueAtTime(0.12,t+i*0.09+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.09+0.4);o.connect(g).connect(actx.destination);o.start(t+i*0.09);o.stop(t+i*0.09+0.45)})}catch(e){}}
function chargeHit(p){
  for(const pen of S.pens){if(Math.hypot(p.x-pen.x,p.y-pen.y)<pen.r+22){
    S.pens.splice(S.pens.indexOf(pen),1);bonk(p,pen.x,pen.y,'Crash! The pen gives way!','#e6b422');
    const freed=S.strays.filter(s=>s.pen===pen);for(const s of freed){S.strays.splice(S.strays.indexOf(s),1);recruit(s,true)}
    toast(`You broke ${freed.length} sheep out of the pen: ${freed.map(s=>s.name+(s.ram?' the ram':'')).join(', ')}!`,4.5);
    S.rubble.push({x:pen.x-pen.r,y:pen.y-pen.r,w:pen.r*2,h:pen.r*2});return}}
  for(const t of S.trees){if(Math.hypot(p.x-t.x,p.y-t.y)<t.r+20){const g=Math.min(t.res,1+~~rnd(0,2)+bonus(),Math.floor(room()));if(g<=0){bonk(p,t.x,t.y,'','#fff');fullUp(p);return}t.res-=g;S.wood+=g;bonk(p,t.x,t.y,`+${g} wood`,'#c89a5c');
    if(t.res<=0){S.trees.splice(S.trees.indexOf(t),1);S.stumps.push({x:t.x,y:t.y});say(t.x,t.y-30,'Timber!','#c89a5c')}return}}
  for(const r of S.rocks){if(r.big&&Math.hypot(p.x-r.x,p.y-r.y)<r.r+20){
    if(S.horns<1){bonk(p,r.x,r.y,'Ow! Too hard for a bare head.','#e05a4a');if(!S.stoneShown){S.stoneShown=true;toast('Rock is too hard to break with your head. Craft a Ram-horn Helm from wood first.')}return}
    const g=Math.min(r.res,1+~~rnd(0,2)+bonus(),Math.floor(room()));if(g<=0){bonk(p,r.x,r.y,'','#fff');fullUp(p);return}r.res-=g;S.stone+=g;r.r=Math.max(12,r.r-3);bonk(p,r.x,r.y,`+${g} stone`,'#c9c6bb');
    if(r.res<=0){S.rocks.splice(S.rocks.indexOf(r),1);S.rubble.push({x:r.x,y:r.y,w:22,h:22,stone:1})}return}}
  for(const k of S.wrecks){if(Math.hypot(p.x-k.x,p.y-k.y)<k.r+22){
    if(S.horns<2){bonk(p,k.x,k.y,'Clang! Your horns just bounce off.','#e05a4a');if(!S.metalShown){S.metalShown=true;toast('Old machines hold metal, but you need Stone-tipped Horns to break into them.')}return}
    const g=Math.min(k.res,1+~~rnd(0,2)+(S.horns>=3?1:0)+Math.floor(S.flock.length/5),Math.floor(room()));if(g<=0){bonk(p,k.x,k.y,'','#fff');fullUp(p);return}k.res-=g;S.metal+=g;bonk(p,k.x,k.y,`+${g} metal`,'#9fb4c4');salvage(p,k.x,k.y);
    if(k.res<=0){S.wrecks.splice(S.wrecks.indexOf(k),1);S.rubble.push({x:k.x-15,y:k.y-10,w:30,h:20,metal:1});say(k.x,k.y-30,'Stripped for scrap!','#9fb4c4')}return}}
  for(const h of S.houses){if(inHouse(p,h,20)){salvage(p,h.x+h.w/2,h.y+h.h/2);const g=Math.min(h.res,2+~~rnd(0,2)+bonus()*2,Math.floor(room()));if(g<=0){bonk(p,h.x+h.w/2,h.y+h.h/2,'','#fff');fullUp(p);return}h.res-=g;S.wood+=g;bonk(p,h.x+h.w/2,h.y+h.h/2,`+${g} wood`,'#c89a5c');

}

const lockReason=r=>{const rs=[];if(r.need&&!r.need())rs.push(r.needText.replace(/^Needs /,''));

const canPay=c=>Object.entries(c).every(([k,v])=>S[k]>=v);

const shelterHere=()=>S.folds.find(f=>Math.hypot(S.p.x-f.x,S.p.y-f.y)<f.r);

const RES=[['wool','Wool','#f4f2e6'],['wood','Wood','#c89a5c'],['stone','Stone','#a9a69a'],['metal','Metal','#8fa3b2'],['tech','Tech','#6fd3e0']];

    if(!f){S.folds.push({x:p.x,y:p.y,r:85,tier:1,hp:SHELTERS[1].hp,max:SHELTERS[1].hp});say(p.x,p.y-40,'A pen! Everyone in.','#9cbf6a')}
    else{f.tier++;f.hp=f.max=SHELTERS[f.tier].hp;say(p.x,p.y-40,`${SHELTERS[f.tier].name}!`,'#9cbf6a')}}
  else if(id==='repair'){const f=shelterHere();f.hp=Math.min(f.max,f.hp+f.max/3);say(p.x,p.y-40,'Patched up.','#9cbf6a')}
  else if(id==='horns1'){S.horns=1;say(p.x,p.y-40,'Horns on! Now for some rock.','#e6b422')}
  else if(id==='horns2'){S.horns=2;say(p.x,p.y-40,'Stone-tipped! Metal next.','#e6b422')}
  else if(id==='horns3'){S.horns=3;say(p.x,p.y-40,'Iron-shod!','#e6b422')}
  else if(id==='horns4'){S.horns=4;say(p.x,p.y-40,'Bzzzt! Dynamo Horns!','#6fd3e0')}
  else if(id==='horns5'){S.horns=5;say(p.x,p.y-40,'LASER HORNS!','#ff4d6d');toast('Laser Horns! Flossy now fires at any predator that comes within range.',4.5)}
  else if(id==='ramrig'){S.ramLasers=true;say(p.x,p.y-40,'The rams are armed!','#ff4d6d')}
  else if(id==='shears1'){S.shears=1;say(p.x,p.y-40,'Snip snip.','#f4f2e6');toast('Shears made! Press F or SHEAR near flockmates with a yellow dot. They can shear you too.',4.5)}
  else if(id==='shears2'){S.shears=2;say(p.x,p.y-40,'Proper shears!','#f4f2e6')}
  else if(id==='wall'){const a=p.face+Math.PI/2;for(let k=-3;k<3;k++){const x=fx+Math.cos(a)*(k+0.5)*24,y=fy+Math.sin(a)*(k+0.5)*24;if(terrAt(x,y)!==WATER)S.walls.push({x,y,r:12})}say(fx,fy-24,'Stone on stone.','#c9c6bb')}
  else if(id==='decoy'){S.decoys.push({x:fx,y:fy,hp:3,decoy:true});say(fx,fy-24,'Baa? (it says nothing)','#e0835a')}
  else if(id==='trap'){S.traps.push({x:fx,y:fy});say(fx,fy-24,'Lovely.','#c89a5c')}
}
function bleat(){
  const p=S.p;S.bleatCd=4;S.pings.push({x:p.x,y:p.y,t:0});say(p.x,p.y-34,'BAAAAA!','#e6b422');
  let found=0;
  for(const s of S.strays){const d=Math.hypot(s.x-p.x,s.y-p.y);if(d<BLEAT_RANGE){s.seen=3.5;found++;
    setTimeout(()=>{if(S.strays.includes(s))say(s.x,s.y-24,['Baa!','Over here!','Meh?','Baaa!'][~~rnd(0,4)],'#cfe0ff')},300+d*1.2)}}
  if(!found)toast('No answer. No sheep within earshot.',2);
  // bleating at night carries, and something hears it
  if(isNight())S.sp.wolf-=2.5;
}
function shear(){
  const p=S.p;let got=0,n=0;
  if(S.shears<1)return;
  const reach=S.shears>=2?180:110,mult=S.shears>=2?1.5:1;
  // the flock can shear Flossy too
  if(room()<1){fullUp(p);return}
  if(p.fleece>=3&&S.flock.length){const w=(p.fleece-1.5)*mult;got+=w;n++;p.fleece=1.5;say(p.x,p.y-22,'snip','#f4f2e6')}
  for(const s of S.flock){if(s.fleece>=4&&Math.hypot(s.x-p.x,s.y-p.y)<reach){if(got>=room())break;const w=(s.fleece-1.5)*mult;got+=w;n++;s.fleece=1.5;say(s.x,s.y-22,'snip','#f4f2e6')}}
  got=Math.min(got,room());
  if(n){S.wool+=got;say(p.x,p.y-34,`+${got.toFixed(1)} wool`,'#f4f2e6')}
  else toast(S.flock.length?'No fleece is ready yet. Fleeces are ready at 4 kg (shown by a yellow dot).':'You need a flock to shear.',2.5);
}

// ---------- update ----------
function update(dt){
  S.t+=dt;const p=S.p;
  const day=1+Math.floor(S.t/DAY);
  if(day!==S.lastDay){S.lastDay=day;S.day=day;toast(`Dawn, day ${day}. The wolves slink off.`)}
  explore();
  const ri=regionAt(p.x,p.y);if(ri!==S.curReg){S.curReg=ri;const R=REG[ri];toast(`${R.name}. ${R.blurb}`,4.5)}
  // player
  const iv=inputVec();
  const heavy=Math.max(0,p.fleece-4);
  let spd=150*(1-Math.min(0.55,heavy*0.075));
  p.grazing=(keys[' ']||keys['g']||grazeBtn)&&p.cast<=0;
  if(p.cast>0){p.cast-=dt;if(neighbours(p,55)>0)p.cast-=dt*2;if(p.cast<=0)say(p.x,p.y-30,'Back on my feet!');}
  if((keys['shift']||keys['e']||chargeReq)&&p.dashCd<=0&&p.cast<=0){p.dash=0.28;p.dashCd=p.dashMax=[2.2,2,1.8,1.1,1,1][S.horns];say(p.x,p.y-30,'Baaa!','#e6b422');if(S.horns>=4)shock(p)}
  chargeReq=false;p.dashCd-=dt;
  S.bleatCd-=dt;if(bleatReq&&S.bleatCd<=0)bleat();bleatReq=false;
  if(shearReq)shear();shearReq=false;
  if(craftReq){craftReq=false;showCraft();return}
  let mx=iv.x,my=iv.y;
  if(p.cast>0||p.grazing){mx=0;my=0}
  if(p.dash>0){p.dash-=dt;spd*=3;if(mx===0&&my===0){mx=Math.cos(p.face);my=Math.sin(p.face)}}
  p.vx+=(mx*spd-p.vx)*Math.min(1,dt*10);p.vy+=(my*spd-p.vy)*Math.min(1,dt*10);
  moveBy(p,dt);
  const moving=Math.hypot(p.vx,p.vy)>40;
  if(moving){p.face=Math.atan2(p.vy,p.vx);p.bob+=dt*12;p.still=0}else p.still+=dt;
  if(p.dash>0)chargeHit(p);
  // rubbing on trees, rocks and posts tears off a little fleece, but only down to 3 kg; shears do the rest
  let rubbing=false;
  if(moving&&p.dash<=0){for(const r of S.rocks.concat(S.posts,S.trees)){if(Math.hypot(p.x-r.x,p.y-r.y)<r.r+16){rubbing=true;break}}}
  collide(p,14);
  if(rubbing&&p.fleece>3){const d=Math.min(p.fleece-3,0.5*dt);p.fleece-=d;S.wool+=Math.min(d*0.3,room());if(Math.random()<dt*3)say(p.x+rnd(-10,10),p.y-20,'scritch','#c9c3a8')}
  else if(rubbing&&!S.rubShown){S.rubShown=true;say(p.x,p.y-30,'That\'s as much as rubbing will get off.','#c9c3a8')}
  p.fleece+=dt*0.035;
  if(p.fleece>7&&moving&&p.cast<=0&&p.dash<=0&&Math.random()<dt*0.04*(p.fleece-7)){p.cast=3;toast('Cast! Too much fleece, and Flossy has rolled onto her back. A flockmate nearby helps her up faster.')}
  // hunger and grazing
  const sh=shelterHere();
  p.hunger-=dt*(0.42+heavy*0.04+S.flock.length*0.008)*(sh&&sh.tier>=2?0.6:1);
  if(sh&&sh.tier>=4&&p.still>1)p.health+=dt*2;
  if(p.grazing){
    // every sheep eats its own patch, and the hunger bar is the whole flock's
    let eaten=0;for(const s of allSheep()){const i=tileAt(s.x,s.y),g=S.grass[i];if(g>0.05){const e=Math.min(g,dt*0.08);S.grass[i]-=e;eaten+=e}}
    p.hunger+=eaten*42/(S.flock.length+1);
    if(S.flock.length>=3&&eaten<dt*0.08*(S.flock.length+1)*0.3&&!S.barrenShown){S.barrenShown=true;toast('This pasture is grazed bare. Grass takes many days to grow back, so move the flock on.',4.5)}
    if(isNight()&&!S.grazeShown&&!inFold(p)){S.grazeShown=true;toast('Heads down. While the flock grazes it spreads out and can\'t see the wolves coming.')}}
  p.hunger=clamp(p.hunger,0,100);
  if(p.hunger<=0)p.health-=dt*6;else if(p.hunger>50)p.health+=dt*1.2;
  p.health=Math.min(100,p.health);
  // regrowth is slow, and bare earth is slowest of all to recover
  for(let i=0;i<S.grass.length;i++){const g=S.grass[i];if(g<1&&S.terr[i]===MEADOW)S.grass[i]=Math.min(1,g+dt*(g<0.05?0.0003:0.0008))}

  // strays wander and join
  for(let i=S.strays.length-1;i>=0;i--){const s=S.strays[i];s.seen-=dt;
    if(Math.abs(s.x-p.x)>1400||Math.abs(s.y-p.y)>1400){s.fleece+=dt*0.01;continue}
    s.wand+=rnd(-1,1)*dt;const sp=Math.random()<0.5?14:0;
    s.vx=Math.cos(s.wand)*sp;s.vy=Math.sin(s.wand)*sp;moveBy(s,dt);if(sp)s.face=s.wand;collide(s,12);
    s.fleece+=dt*0.01;
    if(s.pen){const d=Math.hypot(s.x-s.pen.x,s.y-s.pen.y);if(d>s.pen.r-14){s.x=s.pen.x+(s.x-s.pen.x)/d*(s.pen.r-14);s.y=s.pen.y+(s.y-s.pen.y)/d*(s.pen.r-14)}
      if(!S.penShown&&Math.hypot(s.x-p.x,s.y-p.y)<vision()){S.penShown=true;toast('An old pen with sheep shut inside! Charge the hurdles to break them out.',4.5)}
      continue}
    if(Math.hypot(s.x-p.x,s.y-p.y)<75){S.strays.splice(i,1);recruit(s)}}

  // flock: follow Flossy, and circle her while she keeps moving
  const fl=S.flock,R=44+Math.sqrt(fl.length)*11;
  S.circling=fl.length>=CIRCLE_MIN&&p.still<0.6&&p.cast<=0;
  if(S.circling&&!S.circleShown&&isNight()){S.circleShown=true;toast('The flock circles Flossy while she moves. Wolves won\'t break a moving circle.')}
  S.orbit+=dt*(S.circling?1.6:0);
  fl.forEach((s,idx)=>{
    let ax=0,ay=0;const dx=p.x-s.x,dy=p.y-s.y,d=Math.hypot(dx,dy)||1;
    if(S.circling){
      const a=S.orbit+idx/fl.length*Math.PI*2,tx=p.x+p.vx*0.25+Math.cos(a)*R,ty=p.y+p.vy*0.25+Math.sin(a)*R;
      ax+=(tx-s.x)*9;ay+=(ty-s.y)*9;
    }else{
      const want=(40+Math.sqrt(fl.length)*14)*(p.grazing?1.9:1)*(inFold(p)?0.6:1);
      if(d>want){ax+=dx/d*(d-want)*5;ay+=dy/d*(d-want)*5}
    }
    // while grazing, a sheep on a bare patch shuffles to the greenest patch beside it
    if(p.grazing&&S.grass[tileAt(s.x,s.y)]<0.15){let bx=0,by=0,bg=0.15;
      for(const[ox,oy]of[[-T,0],[T,0],[0,-T],[0,T],[-T,-T],[T,T],[-T,T],[T,-T]]){const g=S.grass[tileAt(s.x+ox,s.y+oy)];if(g>bg){bg=g;bx=ox;by=oy}}
      if(bg>0.15){ax+=bx*5;ay+=by*5}}
    for(const o of fl){if(o===s)continue;const ox=s.x-o.x,oy=s.y-o.y,od=Math.hypot(ox,oy);if(od<24&&od>0){ax+=ox/od*(24-od)*9;ay+=oy/od*(24-od)*9}}
    const pd=Math.hypot(s.x-p.x,s.y-p.y);if(pd<30&&pd>0){ax+=(s.x-p.x)/pd*(30-pd)*9;ay+=(s.y-p.y)/pd*(30-pd)*9}
    if(!S.circling&&!p.grazing)for(const w of S.preds){if(!hostile(w)||w.kind==='dog')continue;const wd=Math.hypot(s.x-w.x,s.y-w.y);if(wd<140&&wd>0){ax+=(s.x-w.x)/wd*120;ay+=(s.y-w.y)/wd*120}}
    // a wild sheepdog drives sheep before it
    for(const w of S.preds){if(w.kind!=='dog'||w.tame||w.state==='stun')continue;const wd=Math.hypot(s.x-w.x,s.y-w.y);if(wd<110&&wd>0){ax+=(s.x-w.x)/wd*520;ay+=(s.y-w.y)/wd*520}}
    s.vx+=ax*dt;s.vy+=ay*dt;s.vx*=Math.pow(0.12,dt);s.vy*=Math.pow(0.12,dt);
    const v=Math.hypot(s.vx,s.vy),max=s.charge>0?420:(S.circling?280:205)*(1-Math.max(0,s.fleece-5)*0.06);if(v>max){s.vx*=max/v;s.vy*=max/v}
    moveBy(s,dt);if(v>15){s.face=Math.atan2(s.vy,s.vx);s.bob+=dt*12}
    collide(s,12);
    s.fleece=Math.min(9,s.fleece+dt*0.03);
    // rams charge anything that threatens the flock, on their own
    s.rcd-=dt;if(s.hp<s.maxhp)s.hp=Math.min(s.maxhp,s.hp+dt/40);
    if(s.ram&&!s.charge&&(s.rcd<=0||p.dash>0.2)){const t=nearestPred(s,230);if(t){s.charge=0.5;s.rcd=2.5;const a=Math.atan2(t.y-s.y,t.x-s.x);s.vx=Math.cos(a)*420;s.vy=Math.sin(a)*420;if(Math.random()<.4)say(s.x,s.y-24,'Ram charge!','#e6b422')}}
    if(s.charge>0){s.charge-=dt;if(s.charge<=0)s.charge=0}
  });
  for(let i=fl.length-1;i>=0;i--){const s=fl[i];if(Math.hypot(s.x-p.x,s.y-p.y)>560){fl.splice(i,1);s.seen=0;S.strays.push(s);say(s.x,s.y-24,`${s.name} is driven off!`,'#e05a4a')}}
  S.maxFlock=Math.max(S.maxFlock,fl.length+1);

  // predators: what turns up depends on the region and the time of day
  spawnPreds(dt);
  lasers(dt);
  const protectedNow=S.circling;
  for(let i=S.preds.length-1;i>=0;i--){const w=S.preds[i];w.st-=dt;w.bite-=dt;w.cd-=dt;
    const pdist=Math.hypot(w.x-p.x,w.y-p.y)||1;
    if(pdist>1600&&!w.tame){S.preds.splice(i,1);continue}
    if(w.kind==='dog'){updateDog(w,dt,pdist,R);continue}
    const fox=w.kind==='fox';
    if(!isNight()&&!w.dayborn&&w.state!=='flee'){w.state='flee';w.st=99}
    if((w.state==='stun'||w.state==='stuck')&&w.st<=0){w.state='flee';w.st=5}
    for(const tr of S.traps){if(w.state!=='stuck'&&Math.hypot(w.x-tr.x,w.y-tr.y)<22){w.state='stuck';w.st=5;w.vx=w.vy=0;S.traps.splice(S.traps.indexOf(tr),1);say(w.x,w.y-24,`Dag trap! The ${w.kind} is stuck fast.`,'#c89a5c');break}}
    if(w.state==='flee'&&w.st<=0&&(isNight()||w.dayborn))w.state='hunt';
    let tx=0,ty=0,sp=0;
    if(w.state==='stun'||w.state==='stuck'){sp=0}
    else if(w.state==='flee'){tx=(w.x-p.x)/pdist;ty=(w.y-p.y)/pdist;sp=fox?185:170}
    else{
      // pick a target: decoys first, then the most isolated sheep outside a fold, or a pen with sheep in it
      let best=null,bs=1e9;
      for(const dc of S.decoys){const d=Math.hypot(dc.x-w.x,dc.y-w.y);if(d<500&&d*0.5<bs){bs=d*0.5;best=dc}}
      for(const s of allSheep()){if(inFold(s))continue;const d=Math.hypot(s.x-w.x,s.y-w.y);const sc=d*(1+neighbours(s,90)*0.15)*(fox&&s.ram?1.6:1);if(sc<bs){bs=sc;best=s}}
      for(const f of S.folds){if(f.hp===Infinity||!allSheep().some(s=>Math.hypot(s.x-f.x,s.y-f.y)<f.r))continue;
        const d=Math.hypot(w.x-f.x,w.y-f.y)||1,ex=f.x+(w.x-f.x)/d*(f.r+14),ey=f.y+(w.y-f.y)/d*(f.r+14),sc=Math.hypot(ex-w.x,ey-w.y)*0.9;
        if(sc<bs){bs=sc;best={x:ex,y:ey,shelter:f}}}
      if((protectedNow&&pdist<420&&!(best&&(best.decoy||best.shelter)))||!best){
        // a moving circle (or a closed fold): predators pace around, waiting
        w.orb+=dt*0.7;const fd=S.folds.find(f=>Math.hypot(p.x-f.x,p.y-f.y)<f.r),ox=fd?fd.x:p.x,oy=fd?fd.y:p.y,orR=(fd?fd.r:R)+110;
        const gx=ox+Math.cos(w.orb)*orR,gy=oy+Math.sin(w.orb)*orR,gd=Math.hypot(gx-w.x,gy-w.y)||1;
        tx=(gx-w.x)/gd;ty=(gy-w.y)/gd;sp=Math.min(190,gd*3);
      }else{const d=Math.hypot(best.x-w.x,best.y-w.y)||1;tx=(best.x-w.x)/d;ty=(best.y-w.y)/d;sp=(fox?150:140+S.day*5)*(p.grazing?1.2:1);
        if(best.shelter&&d<24&&w.bite<=0){const f=best.shelter;f.hp-=fox?3:6;w.bite=1.3;S.shake=0.1;say(w.x,w.y-22,'Crunch!','#e0835a');
          if(f.hp<=0){S.folds.splice(S.folds.indexOf(f),1);S.rubble.push({x:f.x-f.r*0.7,y:f.y-f.r*0.7,w:f.r*1.4,h:f.r*1.4});toast(`Predators broke through the ${SHELTERS[f.tier].name}!`)}
          else if(f.hp<f.max*0.3&&!f.warned){f.warned=true;toast(`The ${SHELTERS[f.tier].name} is giving way. Patch it up from the craft menu.`)}}
        else if(d<18&&w.bite<=0&&!best.shelter){
          if(best.decoy){best.hp--;w.bite=1;w.state='flee';w.st=3;say(best.x,best.y-22,best.hp>0?'Chomp... that tasted odd.':'The decoy falls apart. Just sticks and wool.','#e0835a');
            if(best.hp<=0)S.decoys.splice(S.decoys.indexOf(best),1)}
          else if(best===p){if(p.dash<=0){p.health-=fox?10:25;say(p.x,p.y-30,'Ouch!','#e05a4a');w.bite=1.5;w.state='flee';w.st=fox?3:1.5}}
          else{best.hp-=fox?1:2;
            if(best.hp<=0){S.flock.splice(S.flock.indexOf(best),1);say(best.x,best.y-20,`${best.name} is taken!`,'#e05a4a');toast(`${best.name}${best.ram?' the ram':''} was taken.`,3);w.state='flee';w.st=6}
            else{say(best.x,best.y-20,fox?'Nip! (bitten)':best.ram?'The ram shrugs off a bite!':'Bitten!','#e0835a');w.bite=fox?2:1.2;if(fox){w.state='flee';w.st=2.5}}}
        }}
    }
    w.vx+=(tx*sp-w.vx)*Math.min(1,dt*4);w.vy+=(ty*sp-w.vy)*Math.min(1,dt*4);
    moveBy(w,dt);
    for(const f of S.folds){const d=Math.hypot(w.x-f.x,w.y-f.y);if(d<f.r+14&&d>0){w.x=f.x+(w.x-f.x)/d*(f.r+14);w.y=f.y+(w.y-f.y)/d*(f.r+14)}}if(Math.hypot(w.vx,w.vy)>10)w.face=Math.atan2(w.vy,w.vx);collide(w,fox?9:12);
    for(const h of [p,...S.flock.filter(s=>s.charge>0)]){if((h===p?p.dash>0:true)&&Math.hypot(h.x-w.x,h.y-w.y)<34&&w.state!=='stun'){
      const a=Math.atan2(w.y-h.y,w.x-h.x);w.vx=Math.cos(a)*400;w.vy=Math.sin(a)*400;w.state='stun';w.st=[1.2,1.5,1.9,2.6,3,3][S.horns]*(fox?1.4:1);say(w.x,w.y-24,h===p?'Headbutt!':'Rammed!','#e6b422')}}
    if(S.flock.length>=10&&w.state==='hunt'&&!w.warned&&pdist<380&&pdist>vision()){w.warned=true;
      const dir=['east','south-east','south','south-west','west','north-west','north','north-east'][((Math.round(Math.atan2(w.y-p.y,w.x-p.x)/(Math.PI/4))%8)+8)%8];
      say(p.x,p.y-48,`${fox?'Fox':'Wolf'} to the ${dir}!`,'#e05a4a');S.alerts.push({w,t:2.5})}
    if(w.state==='flee'&&pdist>950)S.preds.splice(i,1);
  }
  for(let i=S.texts.length-1;i>=0;i--){const t=S.texts[i];t.life-=dt;t.y-=dt*14;if(t.life<=0)S.texts.splice(i,1)}
  for(let i=S.alerts.length-1;i>=0;i--){S.alerts[i].t-=dt;if(S.alerts[i].t<=0)S.alerts.splice(i,1)}
  for(let i=S.pings.length-1;i>=0;i--){S.pings[i].t+=dt;if(S.pings[i].t>1.4)S.pings.splice(i,1)}
  S.shake=Math.max(0,S.shake-dt);S.cheer=Math.max(0,(S.cheer||0)-dt*1.5);
  for(let i=S.confetti.length-1;i>=0;i--){const c=S.confetti[i];c.t-=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=0.94;c.vy*=0.94;if(c.t<=0)S.confetti.splice(i,1)}
  const n=fl.length+1;
  if(n>=5&&!S.flockShown){S.flockShown=true;toast('Rank up: Flock. While you keep moving, they circle you and the wolves hold back.',4.5)}

  // the circle while moving
  if(S.circling){ctx.strokeStyle='rgba(156,191,106,.45)';ctx.setLineDash([5,7]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,44+Math.sqrt(S.flock.length)*11+16,0,7);ctx.stroke();ctx.setLineDash([])}
  // wolves' eyes in the dark
  if(nt>0.3){for(const w of S.preds){if(w.kind==='dog')continue;const d=Math.hypot(w.x-p.x,w.y-p.y);if(d<vr+10||d>EYES_RANGE)continue;

    ctx.fillStyle=`rgba(255,214,90,${(nt-0.3)*1.4*(1-d/EYES_RANGE*0.5)})`;ctx.beginPath();ctx.arc(x+ox,y+oy,2.3,0,7);ctx.arc(x-ox,y-oy,2.3,0,7);ctx.fill()}}
  for(const al of S.alerts){const a=Math.atan2(al.w.y-p.y,al.w.x-p.x),rr=vr+26,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;
    ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.globalAlpha=Math.min(1,al.t);ctx.fillStyle='#e05a4a';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-6,-8);ctx.lineTo(-6,8);ctx.fill();ctx.restore()}

  if(S.cheer>0){ctx.strokeStyle=`rgba(230,180,34,${S.cheer*0.6})`;ctx.lineWidth=6;ctx.beginPath();ctx.arc(cx,cy,60+(1-S.cheer)*160,0,7);ctx.stroke()}
  // bleat: echo ring, and strays that answered show through the fog
  for(const pg of S.pings){const k=pg.t/1.4;ctx.strokeStyle=`rgba(230,180,34,${0.6*(1-k)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(pg.x-camx,pg.y-camy,k*BLEAT_RANGE,0,7);ctx.stroke()}
  for(const s of S.strays)if(s.seen>0&&!seen(s,10)){const x=s.x-camx,y=s.y-camy;if(!onScreen(x,y,10))continue;
    ctx.globalAlpha=Math.min(1,s.seen);ctx.fillStyle='rgba(207,224,255,.25)';ctx.beginPath();ctx.arc(x,y,20,0,7);ctx.fill();ctx.fillStyle='#cfe0ff';ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();ctx.globalAlpha=1}

  if(p.grazing){ctx.fillStyle='rgba(244,242,230,.85)';ctx.font='600 12px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.fillText(S.grass[tileAt(p.x,p.y)]>0.05?'munch':(terrAt(p.x,p.y)===MEADOW?'bare ground, move on':'nothing to eat here'),cx,cy+34)}
  ctx.textAlign='center';ctx.font='700 13px "Bricolage Grotesque",system-ui,sans-serif';
  for(const t of S.texts){ctx.globalAlpha=Math.min(1,t.life);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillText(t.txt,t.x-camx+1,t.y-camy+1);ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x-camx,t.y-camy)}

function hud(){
  const p=S.p,set=(id,v)=>$(id).textContent=v,bar=(id,f)=>$(id).style.width=clamp(f,0,1)*100+'%';
  const ph=phase(),hrs=(6+ph*24)%24;
  set('day',`Day ${S.day} · ${String(~~hrs).padStart(2,'0')}:${String(~~((hrs%1)*60)).padStart(2,'0')}${isNight()?' · night':''}`);
  set('rank',rank(S.flock.length+1));
  bar('bHunger',p.hunger/100);set('vHunger',~~p.hunger);bar('bHealth',p.health/100);set('vHealth',Math.max(0,~~p.health));
  bar('bFleece',p.fleece/10);set('vFleece',p.fleece.toFixed(1)+'kg');$('bFleece').style.background=p.fleece>7?'#e0835a':p.fleece>4?'#e6b422':'#f4f2e6';
  const R=REG[regionAt(p.x,p.y)];$('region').textContent=R.name;$('region').style.color=R.col;
  const dogs=S.preds.filter(w=>w.tame).length,rams=S.flock.filter(s=>s.ram).length;
  set('vFlock',`${S.flock.length+1} sheep${rams?` · ${rams} ram${rams>1?'s':''}`:''}${dogs?` · ${dogs} dog${dogs>1?'s':''}`:''}`);const ready=S.flock.filter(s=>s.fleece>=4).length;set('vReady',ready?`${ready} ready`:'');
  const ring=(id,left,max)=>{const b=$(id),pr=max>0?clamp(1-left/max,0,1):1;b.style.setProperty('--p',pr.toFixed(3));b.classList.toggle('cooling',pr<1);b.classList.toggle('ready',pr>=1)};
  $('bShear').hidden=S.shears<1;
  ring('bCharge',p.dashCd,p.dashMax||1);ring('bBleat',S.bleatCd,4);
  const ld=load(),cap=carryCap();bar('bLoad',ld/cap);set('vLoad',`${Math.floor(ld)}/${cap}`);$('bLoad').style.background=ld>=cap-0.5?'#e05a4a':'#c89a5c';
  set('vWool',~~S.wool);set('vWood',S.wood);set('vStone',S.stone);set('vMetal',S.metal);set('vTech',S.tech);
}

// ---------- overlays ----------
const ov=$('overlay'),card=$('card');
function showIntro(){
  card.classList.remove('wide');
  card.innerHTML=`<div class="eb">Prototype · the first nights</div><h1>The Sheep Are <span>Angry!</span></h1>
  <p>The humans are gone. You are Flossy, a ewe with a yellow ear tag. You can only see what's around you, and at night you can barely see at all.</p>
  <ul><li><kbd>WASD</kbd> or arrows to move. On a phone, drag anywhere.</li>
  <li>Hold <kbd>Space</kbd> or GRAZE to eat. Bare brown ground has nothing left.</li>
  <li><kbd>B</kbd> or BLEAT to call out. Sheep nearby answer and show up briefly. At night, wolves hear it too.</li>
  <li><kbd>Shift</kbd> or CHARGE to headbutt. At first you can only break trees and buildings for wood. Better horns let you break big rocks for stone, then old cars and tractors for metal. Charging also knocks wolves back.</li>
  <li>A bigger flock can carry more: each ewe adds 6 to how much you can hold and each ram adds 10.</li>
  <li>A bigger flock sees further, helps you gather more with every charge, and from ten sheep a lookout warns you of wolves. It also gets hungrier and draws more wolves.</li>
  <li>Sheep are rare out here. There's a ewe and a ram somewhere near home, and the old farms have pens with sheep shut inside: charge a pen to break them out.</li>
  <li>Walk near a stray to recruit it. Their fleeces grow, and once you've made shears, press <kbd>F</kbd> or SHEAR near flockmates with a yellow dot to harvest wool.</li>
  <li>The map is split into regions. Home Meadows are gentle. The Wildwood has timber and foxes, the Fells have stone and wolves, Old Farmland has barns, tractors and wild sheepdogs, and the Ruined Town is rich in metal but has no grass and danger day and night.</li>
  <li>Rams defend the flock on their own and survive two wolf bites. Foxes are small and need two bites to kill a ewe. A wild sheepdog herds your sheep away, but charge it three times and it's yours.</li>
  <li>Wolves will attack a flock that stands still. With four or more flockmates, keep moving and they circle you, and the wolves can only pace around.</li>
  <li>When you graze, the whole flock grazes, so a big flock strips a pasture fast and grass takes many days to grow back. While heads are down the flock spreads out and can't see far. Only green meadow has grass; scree, bog and old roads have none, bog slows you, and nothing crosses water.</li>
  <li>The best items need a big flock as well as materials. At the top of the tree, Laser Horns let Flossy and her rams zap predators from a distance, using old tech dug out of the Ruined Town.</li>
  <li><kbd>C</kbd> or CRAFT to open the upgrade tree. Start with a Wooden Pen and a Ram-horn Helm. Wolves will chew through a weak pen, so upgrade it as you go: wool-lined, then drystone, then iron-gated.</li>
  <li>Your own fleece slows you down, and too much can leave you cast on your back. Rubbing against trees, rocks and posts tears a little off and gives you a scrap of wool, but only down to 3 kg. To get it all off you need shears.</li></ul>
  <button id="go" type="button">Leave the field</button>`;
  ov.hidden=false;$('go').onclick=start;$('go').focus();
}
function showOver(){
  card.classList.remove('wide');
  card.innerHTML=`<div class="eb">Flossy has fallen</div><h1>Day ${S.day}</h1>
  <p>Largest flock: <b>${S.maxFlock}</b> sheep (${rank(S.maxFlock)}). Gathered <b>${~~S.wool}</b> wool, <b>${S.wood}</b> wood, <b>${S.stone}</b> stone and <b>${S.metal}</b> metal.</p>
  <p>${S.maxFlock<5?'Next time, bleat to find strays before the first night. Alone, a sheep is dinner.':'At night, graze in short bursts. Every time you stop, the wolves close in.'}</p>
  <button id="go" type="button">Try again</button>`;
  ov.hidden=false;$('go').onclick=start;$('go').focus();
}
function start(){newGame();ov.hidden=true;toast('Morning. Bleat to find other sheep before dark.');last=performance.now()}

let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(S.running&&ov.hidden)update(dt);draw();hud();requestAnimationFrame(frame)}
newGame();explore();showIntro();requestAnimationFrame(frame);
</script>
