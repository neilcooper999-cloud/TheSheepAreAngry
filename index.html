<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Sheep Are Angry!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="top"><span id="day">Day 1</span><span id="rank">Stray</span></div>
  <div id="region" class="reg"></div>
  <div class="row"><span>Hunger</span><div class="bar"><i id="bHunger" style="background:#9cbf6a"></i></div><span id="vHunger">100</span></div>
  <div class="row"><span>Health</span><div class="bar"><i id="bHealth" style="background:#e05a4a"></i></div><span id="vHealth">100</span></div>
  <div class="row"><span>Fleece</span><div class="bar"><i id="bFleece" style="background:#f4f2e6"></i></div><span id="vFleece">2kg</span></div>
  <div class="row"><span>Flock</span><span id="vFlock">1 sheep</span><span id="vReady"></span></div>
  <div class="stores"><span>Wool <b id="vWool">0</b></span><span>Wood <b id="vWood">0</b></span><span>Stone <b id="vStone">0</b></span><span>Metal <b id="vMetal">0</b></span><span>Tech <b id="vTech">0</b></span></div>
  <div class="row"><span>Load</span><div class="bar"><i id="bLoad" style="background:#c89a5c"></i></div><span id="vLoad">0/15</span></div>
</div>
<div id="btns">
  <button id="bCraft" class="ready" type="button">CRAFT<span>C</span></button><button id="bShear" class="ready" type="button">SHEAR<span>F</span></button>
  <button id="bBleat" type="button">BLEAT<span>B</span></button><button id="bGraze" class="ready" type="button">GRAZE<span>SPACE</span></button>
  <button id="bCharge" type="button">CHARGE<span>SHIFT</span></button>
</div>
<div id="toast" hidden></div>
<div id="overlay"><div class="card" id="card"></div></div>

<!-- Core: game rules and data, no browser APIs (portable to a native build) -->
<script src="src/core/util.js"></script>
<script src="src/core/data.js"></script>
<script src="src/core/world.js"></script>
<script src="src/core/sim.js"></script>
<!-- Web platform: storage, audio, rendering, HUD, menus and input -->
<script src="src/web/storage.js"></script>
<script src="src/web/audio.js"></script>
<script src="src/web/render.js"></script>
<script src="src/web/hud.js"></script>
<script src="src/web/ui.js"></script>
<script src="src/web/input.js"></script>
<script src="src/main.js"></script>
</body>
</html>
